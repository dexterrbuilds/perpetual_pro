# perpetual_pro — crypto perpetuals day-trading / scalping configuration

exchange:
  # Railway's US region cannot reach Bybit/Binance futures; OKX is the verified
  # working primary data venue there. Fallback remains automatic.
  default: okx
  auto_fallback: true
  fallback_exchanges:
    - okx
    - bybit
    - binanceusdm
    - bitget
    - mexc
    - bingx
    - bitmart
    - gate
    - htx
    - weex
  api_key: ""
  api_secret: ""
  password: ""
  enable_rate_limit: true
  timeout_ms: 30000
  sandbox: false

risk:
  # Prop account management defaults
  prop_mode: true
  # Simulated capital for position sizing (NOT a live exchange balance)
  simulated_capital: 1000.0
  # Risk per trade clamped to [risk_per_trade_min_pct, risk_per_trade_max_pct] in prop mode
  risk_per_trade_pct: 1.0
  risk_per_trade_min_pct: 0.5
  risk_per_trade_max_pct: 1.0
  daily_drawdown_warn_pct: 3.0
  max_open_risk_pct: 2.0
  # Prop max leverage 5x
  max_leverage: 5
  leverage_ceiling: 5.0
  leverage_floor: 1.0
  min_rr: 1.25
  # Tight stops for scalps / day trades
  default_stop_atr_mult: 1.0
  # TP1–TP4: realistic short-term targets (ATR multiples)
  default_tp_atr_mults: [0.7, 1.3, 2.0, 3.0]

# Telegram alert policy (credentials NEVER go here — use env only):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
# Optional: TELEGRAM_ENABLED=1 to force-enable when credentials are set
telegram:
  # enabled is auto-true when both env credentials are present (see load_config)
  min_llm_confidence: 65
  min_rank_score: 50
  parse_mode: "HTML"
  # Confirm every scheduled run, even when the correct call is to stand aside.
  notify_on_empty: true

# Session-aware scans. IANA timezones automatically follow UK/US daylight saving.
scheduler:
  enabled: true
  timezone: "Africa/Lagos"   # Report timestamps remain in WAT
  sessions:
    - name: "London confirmation"
      time: "08:20"          # First 15m London cash-session candle has closed
      timezone: "Europe/London"
    - name: "New York macro follow-through"
      time: "08:50"          # After common 08:30 ET U.S. macro releases
      timezone: "America/New_York"
    - name: "New York open confirmation"
      time: "09:50"          # First 15m U.S. cash-session candle has closed
      timezone: "America/New_York"
    - name: "New York liquidity window"
      time: "15:20"          # Confirmation inside the high-volume 15:00–16:00 ET window
      timezone: "America/New_York"
  # WAT fallback used only if sessions is empty.
  times: []
  # Deep-liquidity crypto-perpetual universe shared with Telegram scans.
  watchlist:
    - BTC
    - ETH
    - SOL
    - BNB
    - TRX
    - UNI
    - XRP
    - DOGE
    - LTC
    - LINK
    - BCH
    - HBAR
    - XLM
    - HYPE
    - ZEC
    - ICP
    - ALGO
    - AVAX
    - PENGU
    - WIF
    - BONK
  exchange: okx
  timeframe: "15m"
  no_news: false
  only_prop_safe: true

# Forward outcome tracking. Only symbols with delivered, qualified alerts are
# subscribed. REST reconciliation is intentionally infrequent to control cost.
signal_tracker:
  enabled: true
  websocket_enabled: true
  websocket_url: "wss://ws.okx.com:8443/ws/v5/public"
  database_path: "./data/signal_tracker.db"
  reconcile_interval_seconds: 1800
  lifecycle_check_seconds: 15
  notification_retry_seconds: 60
  # Production readiness depends on Supabase recovery, never Railway-local SQLite.
  durable_lifecycle_required: true
  target_allocations: [0.25, 0.25, 0.25, 0.25]

# Outcome-calibrated scoring. DATABASE_URL is read from the backend environment
# only. Shadow mode cannot change production signal eligibility or ordering.
outcome_scoring:
  enabled: true
  mode: "shadow"
  feature_schema_version: "3.0"
  model_refresh_seconds: 300
  minimum_training_samples: 500
  minimum_calibration_samples: 200
  confidence_floor: 80
  conservative_quantile: 0.10
  promotion_max_ece: 0.05
  promotion_minimum_unseen_samples: 200

# Pure day-trade stack: 15m execution, 1h drive, 4h confirmation
timeframes:
  primary: "15m"
  higher:
    - "1h"
    - "4h"
  ohlcv_limit: 700
  # Reuse live market data for five minutes and bound concurrent public requests.
  cache_ttl_seconds: 300
  fetch_workers: 4

analysis:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  ema_fast: 9
  ema_mid: 21
  ema_slow: 50
  ema_trend: 200
  # Intraday confluence: EMA/Supertrend, momentum, structure, and 15m/1h/4h
  # alignment carry most of the score. News is context, never a primary trigger.
  weights:
    trend: 0.17
    momentum: 0.18
    structure: 0.17
    multi_tf: 0.16
    volume: 0.11
    derivatives: 0.10
    volatility: 0.07
    patterns: 0.03
    news: 0.01
  min_confidence: 15
  max_confidence: 92
  # A directional signal must pass all three gates. Otherwise the webapp shows
  # a bias only and explicitly says to stand aside.
  directional_score_threshold: 0.20
  directional_confidence_threshold: 68
  # Interim Legacy V2: preserve Technical Score, but overall confidence cannot
  # exceed Execution + 5. The old 65 floor is retained only for comparison.
  legacy_v2_enabled: true
  legacy_execution_min_score: 65
  execution_min_score: 72
  execution_confidence_buffer: 5
  # Hard execution-quality gates used before any Telegram alert.
  max_immediate_sl_risk: 32
  max_chase_distance_atr: 1.0
  # Suppress late retest alerts after most of the Entry→TP1 move is gone.
  max_pre_entry_tp1_progress_pct: 70
  max_spread_bps: 12
  # Execution sources older than these limits are rejected as stale.
  max_ticker_age_seconds: 45
  max_orderbook_age_seconds: 30
  min_tp2_rr: 1.25
  # Pending entry lifetime: READY resolves faster; RETEST gets six 15m candles.
  ready_entry_expiry_bars: 3
  retest_entry_expiry_bars: 6
  max_entry_valid_minutes: 180
  # Phase 2A deterministic quality/cost policy. These are conservative
  # estimates used only when venue/account-specific costs are unavailable.
  execution_policy_version: execution_quality_v2a.1
  execution_taker_fee_bps_per_side: 5.0
  execution_slippage_bps_per_side: 1.5
  execution_funding_bps_per_8h: 1.0
  # Reference depth-impact size; this is not an order and no order is placed.
  execution_impact_notional_usd: 10000

news:
  enabled: true
  cryptopanic_token: ""
  max_articles: 12
  # Prefer headlines from the last 1–4 hours (hard filter when timestamps exist)
  lookback_hours: 4
  bullish_keywords:
    - approval
    - etf
    - inflow
    - partnership
    - adoption
    - upgrade
    - bullish
    - rally
    - listing
    - institutional
  bearish_keywords:
    - hack
    - exploit
    - lawsuit
    - ban
    - sec
    - crash
    - liquidat
    - delist
    - fraud
    - outage
    - investigation

llm:
  enabled: true
  groq_api_key: ""
  gemini_api_key: ""
  groq_model: "llama-3.1-8b-instant"
  gemini_model: "gemini-2.0-flash"
  timeout_s: 25

ocr:
  engine: dual
  tesseract_cmd: ""
  languages:
    - en
  easyocr_gpu: false
  min_confidence: 0.35

screen:
  default_mode: interactive
  dark_theme: true
  save_capture: true
  annotate: true
  output_dir: "./output"

vision:
  use_ollama: true
  ollama_base_url: "http://127.0.0.1:11434"
  ollama_model: "llava"
  ollama_timeout_s: 45

output:
  save_markdown: true
  save_json: true
  output_dir: "./output"
  show_disclaimer: true

logging:
  level: INFO
  file: "./logs/perpetual_pro.log"
  rotation: "10 MB"
  retention: "14 days"
